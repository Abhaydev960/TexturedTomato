
name: Build Portable Windows Application

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r TexturedTomato/requirements.txt
          pip install pyinstaller

      - name: Build Application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name TexturedTomato TexturedTomato/main.py

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: TexturedTomato-Windows
          path: dist/TexturedTomato/
          if-no-files-found: error
